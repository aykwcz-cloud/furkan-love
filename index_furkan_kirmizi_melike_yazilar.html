<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FURKAN ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080000}
body{
  font-family:Consolas,monospace;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at center,#3f0000 0%,#1d0000 35%,#080000 75%);
}
canvas{position:fixed;inset:0;width:100%;height:100%}
#start{
  position:fixed;z-index:5;left:50%;top:50%;
  transform:translate(-50%,-50%);
  border:1px solid #ff3b3b;border-radius:12px;
  padding:15px 28px;color:white;background:rgba(25,0,30,.75);
  box-shadow:0 0 30px #ff0000;
  font:700 18px Consolas,monospace;cursor:pointer;
}
#start:hover{box-shadow:0 0 45px #ff0000;transform:translate(-50%,-50%) scale(1.04)}
#name{
  position:fixed;z-index:4;left:50%;top:50%;
  transform:translate(-50%,-50%);
  color:#fff;font-family:Georgia,serif;font-size:clamp(55px,9vw,115px);
  font-weight:bold;letter-spacing:10px;
  text-shadow:0 0 8px #fff,0 0 20px #ff3030,0 0 45px #ff1010,0 0 80px #ff0000;
  animation:pulse 2s infinite ease-in-out;
  pointer-events:none;
}
@keyframes pulse{50%{text-shadow:0 0 12px #fff,0 0 30px #ff3030,0 0 65px #ff1010}}
#hint{
 position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
 color:rgba(255,180,180,.70);font:12px Consolas,monospace;z-index:4;
}

#loveHeart{position:fixed;z-index:3;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%);pointer-events:none;}
.loveWord{position:absolute;left:50%;top:50%;font:700 clamp(9px,1.05vw,15px) Consolas,monospace;letter-spacing:1px;color:#fff;white-space:nowrap;text-shadow:0 0 5px #fff,0 0 10px #ff3030,0 0 22px #ff1010;transform-origin:center;animation:lovePulse 1.8s ease-in-out infinite;}
@keyframes lovePulse{50%{opacity:.55;text-shadow:0 0 3px #fff,0 0 8px #ff3030,0 0 15px #ff1010}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="name">FURKAN</div>
<div id="loveHeart" aria-hidden="true"></div>

<button id="start">❤️ BAŞLAT ❤️</button>
<div id="hint">kodlar • kalp • neon</div>
<audio id="music" src="sarki.mp3" loop></audio>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,dpr,started=false,particles=[],code=[];
const words=["MELIKE"];

function resize(){
 dpr=Math.min(devicePixelRatio||1,2); W=innerWidth;H=innerHeight;
 c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();

function heart(t){
 const x=Math.sin(t)**3;
 const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
 return {x:x*W*.026,y:y*H*.026};
}
function insideHeart(x,y){
 let xx=(x-W/2)/(W*.026), yy=-(y-H/2)/(H*.026);
 return (xx**2+yy**2-1)**3-xx**2*yy**3<=0;
}
for(let i=0;i<430;i++){
 let x,y;
 do{x=Math.random()*W;y=Math.random()*H}while(!insideHeart(x,y));
 particles.push({
   x,y,tx:x,ty:y,
   s:9+Math.random()*7,a:.35+Math.random()*.65,
   v:(Math.random()-.5)*.18
 });
}
for(let i=0;i<170;i++) code.push({
 x:Math.random()*W,y:Math.random()*H,
 speed:.15+Math.random()*.65,
 text:words[Math.floor(Math.random()*words.length)],
 a:.15+Math.random()*.6,
 size:10+Math.random()*7
});

function draw(){
 ctx.clearRect(0,0,W,H);

 // drifting code
 ctx.textAlign="center";
 for(const q of code){
   q.y+=q.speed;
   if(q.y>H+30){q.y=-20;q.x=Math.random()*W}
   ctx.font=q.size+"px Consolas,monospace";
   ctx.fillStyle=`rgba(255,25,25,${q.a})`;
   ctx.shadowBlur=12;ctx.shadowColor="#ff0000";
   ctx.fillText(q.text,q.x,q.y);
 }
 ctx.shadowBlur=0;

 // heart-shaped code particles
 for(const p of particles){
   p.y += p.v;
   if(p.y>H/2+H*.22 || p.y<H/2-H*.22) p.v*=-1;
   ctx.font=p.s+"px Consolas,monospace";
   ctx.fillStyle=`rgba(255,70,70,${p.a})`;
   ctx.shadowBlur=12;ctx.shadowColor="#ff0000";
   ctx.fillText(words[Math.floor((p.x+p.y)%words.length+words.length)%words.length],p.x,p.y);
 }
 ctx.shadowBlur=0;

 // tiny glowing heart outline
 ctx.beginPath();
 for(let i=0;i<=220;i++){
   const t=i/220*Math.PI*2;
   const p=heart(t);
   const x=W/2+p.x,y=H/2+p.y;
   if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.strokeStyle="rgba(255,20,20,.20)";
 ctx.lineWidth=2;ctx.shadowBlur=25;ctx.shadowColor="#ff0000";ctx.stroke();
 ctx.shadowBlur=0;

 requestAnimationFrame(draw);
}
draw();

document.getElementById("start").onclick=async()=>{
 const m=document.getElementById("music");
 try{await m.play();}catch(e){}
 started=true;
 document.getElementById("start").style.display="none";
 document.getElementById("hint").textContent="FURKAN ❤️";
};

// LOVE YOU yazılarıyla gerçek kalp çerçevesi
const loveHeart=document.getElementById('loveHeart');
function buildLoveHeart(){
  loveHeart.innerHTML='';
  const scale=Math.min(W,H)*0.0285;
  const total=64;
  for(let i=0;i<total;i++){
    const t=(i/total)*Math.PI*2;
    const x=Math.pow(Math.sin(t),3)*16*scale;
    const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*scale;
    const next=(i+0.5)/total*Math.PI*2;
    const nx=Math.pow(Math.sin(next),3)*16*scale;
    const ny=-(13*Math.cos(next)-5*Math.cos(2*next)-2*Math.cos(3*next)-Math.cos(4*next))*scale;
    const angle=Math.atan2(ny-y,nx-x)*180/Math.PI;
    const s=document.createElement('span');
    s.className='loveWord'; s.textContent='LOVE YOU';
    // Her LOVE YOU dikey yazılır; kelimeler üst üste dizilerek kalp çizgisini oluşturur.
    s.style.writingMode='vertical-rl';
    s.style.textOrientation='mixed';
    s.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) rotate(90deg)`;
    s.style.animationDelay=`${(i%12)*.08}s`;
    loveHeart.appendChild(s);
  }
}
buildLoveHeart();
addEventListener('resize',buildLoveHeart);
</script>
</body>
</html>
